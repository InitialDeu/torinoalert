name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: pytest -q
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.14.0"
      - run: terraform fmt -check -recursive iac

  deploy:
    needs: test
    # Attivo solo dopo aver creato il ruolo (iac/bootstrap) e impostato la variabile di repository.
    if: vars.AWS_DEPLOY_ROLE_ARN != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC verso AWS, nessuna access key salvata
    env:
      TF_IN_AUTOMATION: "1"
      TF_VAR_admin_chat_id: ${{ secrets.ADMIN_CHAT_ID }}
      TF_VAR_alert_email: ${{ secrets.ALERT_EMAIL }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python scripts/build_lambda.py
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: eu-south-1
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.14.0"
      - run: terraform -chdir=iac init -input=false
      - run: terraform -chdir=iac plan -input=false -out=tfplan
      - run: terraform -chdir=iac apply -input=false tfplan
