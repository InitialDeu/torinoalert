name: CI

on:
  pull_request:
  push:
    branches-ignore: [main] # su main gira già deploy.yml, che include gli stessi test

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: pytest -q

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.14.0"
      - run: terraform fmt -check -recursive iac
      - run: terraform -chdir=iac init -backend=false -input=false
      - run: terraform -chdir=iac validate
      - run: terraform -chdir=iac/bootstrap init -backend=false -input=false
      - run: terraform -chdir=iac/bootstrap validate
